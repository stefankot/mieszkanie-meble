  <text x="1458" y="6240" font-family="sans-serif" font-size="92" font-weight="700" text-anchor="middle">ŁÓŻKO v0008</text>
  <text x="1458" y="6370" font-family="sans-serif" font-size="66" text-anchor="middle">body 2270 × 1636 mm · pozycja [1458,0,6275] · 90°</text>
  <text x="540" y="7030" font-family="sans-serif" font-size="58" text-anchor="middle">wnęki tylne 200 mm</text>

  <!-- dystanse -->
  <line x1="240" y1="7200" x2="440" y2="7200" stroke="#a33" stroke-width="12"/>
  <line x1="240" y1="7145" x2="240" y2="7255" stroke="#a33" stroke-width="12"/>
