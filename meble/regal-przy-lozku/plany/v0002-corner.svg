<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5200 2600" role="img" aria-labelledby="title desc"><title id="title">Regał przy łóżku — ustawienie w prawym dolnym narożniku pokoju</title><desc id="desc">Nowy prosty regał 1946×570 mm stoi tyłem przy ścianie POKOJ-LOZKO-W3 i prawym bokiem dochodzi do POKOJ-LOZKO-W2, tak jak dawne dłuższe skrzydło regału L.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8003c"/></marker><marker id="d" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs><rect x="240" y="120" width="4650" height="2270" fill="#f4f2ed" stroke="#222" stroke-width="28"/><text x="2565" y="300" font-family="Arial,sans-serif" font-size="90" text-anchor="middle" fill="#333">POKÓJ Z ŁÓŻKIEM</text><line x1="4890" y1="120" x2="4890" y2="2390" stroke="#111" stroke-width="32"/><text x="5000" y="1280" font-family="Arial,sans-serif" font-size="62" fill="#333" transform="rotate(90 5000 1280)">POKOJ-LOZKO-W2</text><line x1="240" y1="2390" x2="4890" y2="2390" stroke="#111" stroke-width="32"/><text x="2565" y="2530" font-family="Arial,sans-serif" font-size="62" text-anchor="middle" fill="#333">POKOJ-LOZKO-W3</text><rect x="2944" y="1820" width="1946" height="570" fill="#0047ab" fill-opacity="0.72" stroke="#002e70" stroke-width="24"/><text x="3917" y="2125" font-family="Arial,sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#fff">REGAŁ PRZY ŁÓŻKU</text><line x1="3917" y1="1810" x2="3917" y2="1540" stroke="#b8003c" stroke-width="18" marker-end="url(#a)"/><text x="4005" y="1605" font-family="Arial,sans-serif" font-size="52" fill="#b8003c">front</text><line x1="2944" y1="1700" x2="4890" y2="1700" stroke="#333" stroke-width="8" marker-start="url(#d)" marker-end="url(#d)"/><text x="3917" y="1645" font-family="Arial,sans-serif" font-size="54" text-anchor="middle" fill="#333">1946 mm</text><line x1="2820" y1="1820" x2="2820" y2="2390" stroke="#333" stroke-width="8" marker-start="url(#d)" marker-end="url(#d)"/><text x="2730" y="2115" font-family="Arial,sans-serif" font-size="54" text-anchor="middle" fill="#333" transform="rotate(-90 2730 2115)">570 mm</text><circle cx="4890" cy="2390" r="34" fill="#b8003c"/><text x="4680" y="2320" font-family="Arial,sans-serif" font-size="48" text-anchor="end" fill="#333">narożnik jak wcześniej</text></svg>