  <text x="540" y="7310" font-family="sans-serif" font-size="62" text-anchor="middle" fill="#174">200 mm głębokości wnęk</text>

  <line x1="640" y1="5000" x2="840" y2="5000" stroke="#174" stroke-width="14"/>
  <path d="M840 5000 l-35 -22 v44 z" fill="#174"/>
  <text x="740" y="4950" font-family="sans-serif" font-size="62" text-anchor="middle" fill="#174">przesunięcie +200 mm do centrum pokoju</text>

  <text x="2700" y="6900" font-family="sans-serif" font-size="64">Po przesunięciu korpusu tylne wnęki zajmują dawną strefę 200 mm,</text>
