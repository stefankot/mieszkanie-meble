<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780">
  <defs>
    <style>
      .bg{fill:#f6f3ee}
      .outer{fill:#d8a08e;stroke:#302b28;stroke-width:6}
      .inner{fill:#f7c9bd;stroke:#302b28;stroke-width:5}
      .guide{stroke:#8b817a;stroke-width:2;stroke-dasharray:8 8;opacity:.55}
      .part{stroke:#302b28;stroke-width:10;stroke-linecap:square}
      .label{font:24px system-ui,sans-serif;fill:#302b28}
      .small{font:19px system-ui,sans-serif;fill:#5a514c}
      .title{font:700 30px system-ui,sans-serif;fill:#302b28}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="780"/>
  <text class="title" x="70" y="55">Koralowy kubik — propozycja podziału 600 × 600 mm</text>
  <text class="small" x="70" y="88">Widok od strony drzwi pokoju · głębokość półki 200 mm</text>
  <rect class="outer" x="150" y="130" width="600" height="600" rx="2"/>
  <rect class="inner" x="170" y="150" width="560" height="560"/>
  <line class="guide" x1="310" y1="150" x2="310" y2="710"/>
  <line class="guide" x1="450" y1="150" x2="450" y2="710"/>
  <line class="guide" x1="590" y1="150" x2="590" y2="710"/>
  <line class="guide" x1="170" y1="290" x2="730" y2="290"/>
  <line class="guide" x1="170" y1="430" x2="730" y2="430"/>
  <line class="guide" x1="170" y1="570" x2="730" y2="570"/>
  <line class="part" x1="450" y1="150" x2="450" y2="710"/>
  <line class="part" x1="590" y1="150" x2="590" y2="710"/>
  <line class="part" x1="450" y1="430" x2="590" y2="430"/>
  <line class="part" x1="590" y1="290" x2="730" y2="290"/>
  <line class="part" x1="590" y1="430" x2="730" y2="430"/>
  <line class="part" x1="590" y1="570" x2="730" y2="570"/>
  <text class="label" x="235" y="420" text-anchor="middle">LEWA STRONA</text>
  <text class="small" x="235" y="452" text-anchor="middle">bez podziałów</text>
  <text class="small" x="520" y="385" text-anchor="middle">¼ szerokości</text>
  <text class="small" x="520" y="412" text-anchor="middle">1 podział poziomy</text>
  <text class="small" x="660" y="235" text-anchor="middle">¼ szerokości</text>
  <text class="small" x="660" y="260" text-anchor="middle">pełny podział</text>
  <text class="small" x="660" y="285" text-anchor="middle">4 poziomy</text>
  <text class="small" x="150" y="760">Linie przerywane = siatka referencyjna 4×4; linie grube = rzeczywiste ścianki.</text>
</svg>