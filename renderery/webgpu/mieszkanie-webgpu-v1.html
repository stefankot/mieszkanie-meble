<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mieszkanie — silnik WebGPU</title>
<style>
 html,body{margin:0;height:100%;background:#e3e5e6;font:13px/1.45 system-ui,sans-serif;color:#25241f;overflow:hidden}
 #app{position:fixed;inset:0}
 #app canvas{display:block;width:100%;height:100%}
 #hud{position:fixed;left:12px;top:12px;z-index:20;background:#f8f7f1e6;border:1px solid #bdbbac;border-radius:10px;padding:10px 13px;max-width:min(460px,calc(100vw - 24px))}
 #hud b{display:block;margin-bottom:4px}
 #stan{margin:0;font-size:12px;color:#4a4a42;white-space:pre-wrap}
 #blad{color:#963a2d;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><b>Mieszkanie · silnik WebGPU</b><p id="stan">uruchamianie…</p></div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
 "three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
 "three/tsl":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
 "suncalc":"https://cdn.jsdelivr.net/npm/suncalc@1.9.0/+esm"
}}
</script>
<script>
 window.addEventListener('error', e => {
   const n = document.getElementById('stan');
   if(n) n.innerHTML = '<span id="blad">BŁĄD: ' + e.message + '</span>';
 });
 window.addEventListener('unhandledrejection', e => {
   const n = document.getElementById('stan');
   if(n) n.innerHTML = '<span id="blad">BŁĄD: ' + (e.reason && e.reason.message || e.reason) + '</span>';
 });
</script>
<script type="module" src="./silnik.js"></script>
</body>
</html>
