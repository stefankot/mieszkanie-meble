name: Validate parametric v21 v22
on:
  push:
    paths:
      - '.github/workflows/validate-parametric-v21-v22.yml'
      - 'meble/regal-przy-lozku/wersje/v0021-parametric.json'
      - 'meble/regal-przy-lozku/wersje/v0022-parametric-skrzydlo.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate parametric and schema v2
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {sprawdzParametryczny, rozwinParametryczny} from './renderery/webgpu/parametryczne.js';
          import {validateFurnitureV2} from './renderery/webgpu/furniture-schema-v2.js';
          const paths=[
            'meble/regal-przy-lozku/wersje/v0021-parametric.json',
            'meble/regal-przy-lozku/wersje/v0022-parametric-skrzydlo.json'
          ];
          for(const path of paths){
            const d=JSON.parse(fs.readFileSync(path,'utf8'));
            sprawdzParametryczny(d.parametric);
            const w=rozwinParametryczny(d.parametric);
            validateFurnitureV2(d);
            const expected=d.parametric.layout.columns.count*d.parametric.layout.rows.count;
            if(w.komorki.length!==expected) throw new Error(path+': expected '+expected+' cells, got '+w.komorki.length);
            if(!d.parametric.definitions?.drzwi?.parts?.some(p=>p.id==='panel')) throw new Error(path+': missing drzwi.panel');
            if(!d.parametric.definitions?.drzwi?.parts?.some(p=>p.id==='uchwyt')) throw new Error(path+': missing drzwi.uchwyt');
            console.log(path, w.parts.length, 'parts,', w.komorki.length, 'cells, v2 ok');
          }
          NODE
