<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4900 5200 2800">
  <rect x="240" y="5140" width="4650" height="2270" fill="#f4f4f1" stroke="#555" stroke-width="18"/>
  <text x="2565" y="5070" font-family="sans-serif" font-size="90" text-anchor="middle">POKOJ-LOZKO</text>
  <line x1="240" y1="5140" x2="240" y2="7410" stroke="#333" stroke-width="28"/>
  <text x="300" y="5350" font-family="sans-serif" font-size="70">W4 / okno</text>
  <rect x="240" y="5510" width="40" height="1380" fill="#7fc5df"/>

  <!-- łóżko: placement jak v0008+ -->
  <rect x="640" y="5140" width="1636" height="2270" fill="#ffffff" stroke="#111" stroke-width="24"/>
  <rect x="440" y="5140" width="200" height="2270" fill="#cee7ef" fill-opacity="0.35" stroke="#5d8794" stroke-width="16" stroke-dasharray="35 22"/>
  <text x="1458" y="6240" font-family="sans-serif" font-size="92" font-weight="700" text-anchor="middle">ŁÓŻKO v0014</text>
  <text x="1458" y="6370" font-family="sans-serif" font-size="66" text-anchor="middle">body 2270 × 1636 mm · pozycja [1458,0,6275] · 90°</text>

  <!-- stalowy klocek: world X 2276..2476, world Z 5640..6040 -->
  <rect x="2276" y="5640" width="200" height="400" fill="#dfe3e5" stroke="#6d7478" stroke-width="18"/>
  <text x="2376" y="5825" font-family="sans-serif" font-size="55" text-anchor="middle" transform="rotate(90 2376 5825)">STAL 400×400×200</text>

  <!-- 500 mm od prawej strony/ściany: lokalne +X odpowiada W1 przy y=5140 -->
  <line x1="2570" y1="5140" x2="2570" y2="5640" stroke="#a33" stroke-width="12"/>
  <line x1="2515" y1="5140" x2="2625" y2="5140" stroke="#a33" stroke-width="12"/>
  <line x1="2515" y1="5640" x2="2625" y2="5640" stroke="#a33" stroke-width="12"/>
  <text x="2660" y="5420" font-family="sans-serif" font-size="62" fill="#a33">500 mm od prawej ściany</text>

  <!-- 200 mm głębokości klocka, styka się z frontem łóżka -->
  <line x1="2276" y1="6150" x2="2476" y2="6150" stroke="#174" stroke-width="12"/>
  <line x1="2276" y1="6100" x2="2276" y2="6200" stroke="#174" stroke-width="12"/>
  <line x1="2476" y1="6100" x2="2476" y2="6200" stroke="#174" stroke-width="12"/>
  <text x="2376" y="6260" font-family="sans-serif" font-size="58" text-anchor="middle" fill="#174">200 mm</text>

  <text x="2700" y="6820" font-family="sans-serif" font-size="64">Klocek przylega tylną krawędzią do frontu łóżka.</text>
  <text x="2700" y="6910" font-family="sans-serif" font-size="64">400 mm biegnie wzdłuż łóżka; 200 mm wystaje w stronę pokoju.</text>
  <text x="2700" y="7000" font-family="sans-serif" font-size="64">Nowy footprint wymaga akceptacji tego planu przed aktywacją v0014.</text>
